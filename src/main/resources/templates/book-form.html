<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ajouter un livre</title>
    <style>
        form { width: 500px; }
        label { display: inline-block; width: 120px; margin-top: 10px; }
        input, select, textarea { width: 350px; padding: 5px; }
        button { margin-top: 15px; padding: 8px 15px; }
        .navbar { background-color: #333; overflow: hidden; margin-bottom: 20px; }
        .navbar a { float: left; color: white; padding: 14px 16px; text-decoration: none; }
        .navbar a:hover { background-color: #ddd; color: black; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">Dashboard</a>
        <a href="/books">Livres</a>
        <a href="/customers">Clients</a>
        <a href="/sales">Ventes</a>
        <a href="/reservations">Réservations</a>
    </div>

    <h1>Nouveau livre</h1>

    <a href="/books">Retour à la liste</a>

    <br/><br/>

    <form th:action="@{/books/save}" th:object="${book}" method="post">
        <label>Titre :</label>
        <input type="text" th:field="*{title}" required/><br/>

        <label>Description :</label>
        <textarea th:field="*{description}" rows="3"></textarea><br/>

        <label>Prix (Ar) :</label>
        <input type="number" step="0.01" th:field="*{price}" required/><br/>

        <label>Date de publication :</label>
        <input type="date" th:field="*{publicationDate}"/><br/>

        <label>ISBN :</label>
        <input type="text" th:field="*{isbn}"/><br/>

        <label>Catégorie :</label>
        <select th:field="*{category.id}">
            <option th:each="cat : ${categories}"
                    th:value="${cat.id}"
                    th:text="${cat.name}">
            </option>
        </select><br/>

        <button type="submit">Enregistrer</button>
    </form>
</body>
</html>
