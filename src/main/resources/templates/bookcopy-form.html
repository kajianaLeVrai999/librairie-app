<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ajouter un exemplaire</title>
    <style>
        form { width: 500px; }
        label { display: inline-block; width: 120px; margin-top: 10px; }
        select, input { width: 350px; padding: 5px; }
        button { margin-top: 15px; padding: 8px 15px; }
        .navbar { background-color: #333; overflow: hidden; margin-bottom: 20px; }
        .navbar a { float: left; color: white; padding: 14px 16px; text-decoration: none; }
        .navbar a:hover { background-color: #ddd; color: black; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">🏠 Dashboard</a>
        <a href="/books">📖 Livres</a>
        <a href="/bookcopies">📚 Exemplaires</a>
        <a href="/arrivals">📦 Arrivages</a>
        <a href="/authors">✍️ Auteurs</a>
        <a href="/categories">📂 Catégories</a>
        <a href="/customers">👥 Clients</a>
        <a href="/sales">💰 Ventes</a>
        <a href="/reservations">📅 Réservations</a>
        <a href="/genders">🏷️ Genres</a>
    </div>

    <h1>Nouvel exemplaire</h1>

    <a href="/bookcopies">Retour à la liste</a>

    <br/><br/>

    <form th:action="@{/bookcopies/save}" th:object="${bookCopy}" method="post">
        <label>Livre :</label>
        <select th:field="*{book.id}" required>
            <option value="">-- Sélectionner un livre --</option>
            <option th:each="book : ${books}"
                    th:value="${book.id}"
                    th:text="${book.title}">
            </option>
        </select><br/>

        <label>Statut :</label>
        <select th:field="*{status}">
            <option th:each="status : ${copyStatuses}"
                    th:value="${status}"
                    th:text="${status}">
            </option>
        </select><br/>

        <button type="submit">Enregistrer</button>
    </form>
</body>
</html>
