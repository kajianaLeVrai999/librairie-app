<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Détail de la vente</title>
    <style>
        .info { margin: 10px 0; }
        .label { font-weight: bold; display: inline-block; width: 150px; }
        .navbar { background-color: #333; overflow: hidden; margin-bottom: 20px; }
        .navbar a { float: left; color: white; padding: 14px 16px; text-decoration: none; }
        .navbar a:hover { background-color: #ddd; color: black; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">🏠 Dashboard</a>
        <a href="/books">📖 Livres</a>
        <a href="/bookcopies">📚 Exemplaires</a>
        <a href="/arrivals">📦 Arrivages</a>
        <a href="/authors">✍️ Auteurs</a>
        <a href="/categories">📂 Catégories</a>
        <a href="/customers">👥 Clients</a>
        <a href="/sales">💰 Ventes</a>
        <a href="/reservations">📅 Réservations</a>
        <a href="/genders">🏷️ Genres</a>
    </div>


    <h1>Détail de la vente</h1>

    <a href="/sales">Retour à la liste</a>

    <br/><br/>

    <div th:if="${sale == null}">
        <p style="color:red;">Vente non trouvée</p>
    </div>

    <div th:unless="${sale == null}">
        <div class="info"><span class="label">ID :</span> <span th:text="${sale.id}"></span></div>
        <div class="info"><span class="label">Date :</span> <span th:text="${sale.saleDate}"></span></div>
        <div class="info"><span class="label">Client :</span> <span th:text="${sale.customer != null ? sale.customer.firstName + ' ' + sale.customer.lastName : '—'}"></span></div>
        <div class="info"><span class="label">Exemplaire :</span> <span th:text="'#' + ${sale.bookCopy.id}"></span></div>
        <div class="info"><span class="label">Livre :</span> <span th:text="${sale.bookCopy.book.title}"></span></div>
        <div class="info"><span class="label">Quantité :</span> <span th:text="${sale.quantity}"></span></div>
        <div class="info"><span class="label">Montant total :</span> <span th:text="${sale.totalAmount}"></span> Ar</div>
    </div>
</body>
</html>
