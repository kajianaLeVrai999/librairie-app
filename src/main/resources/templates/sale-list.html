<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste des ventes</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        .navbar { background-color: #333; overflow: hidden; margin-bottom: 20px; }
        .navbar a { float: left; color: white; padding: 14px 16px; text-decoration: none; }
        .navbar a:hover { background-color: #ddd; color: black; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">Dashboard</a>
        <a href="/books">Livres</a>
        <a href="/customers">Clients</a>
        <a href="/sales">Ventes</a>
        <a href="/reservations">Réservations</a>
    </div>

    <h1>Liste des ventes</h1>

    <a href="/sales/new">Enregistrer une vente</a>

    <br/><br/>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Date</th>
                <th>Client</th>
                <th>Quantité</th>
                <th>Montant total</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="sale : ${sales}">
                <td th:text="${sale.id}">1</td>
                <td th:text="${sale.saleDate}">2024-01-01</td>
                <td th:text="${sale.customer != null ? sale.customer.firstName + ' ' + sale.customer.lastName : '—'}">Client</td>
                <td th:text="${sale.quantity}">1</td>
                <td th:text="${sale.totalAmount}">0 Ar</td>
                <td>
                    <a th:href="@{/sales/{id}(id=${sale.id})}">Voir</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
