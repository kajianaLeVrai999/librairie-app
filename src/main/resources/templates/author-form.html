<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ajouter un auteur</title>
    <style>
        form { width: 500px; }
        label { display: inline-block; width: 120px; margin-top: 10px; }
        input, textarea { width: 350px; padding: 5px; }
        button { margin-top: 15px; padding: 8px 15px; }
        .navbar { background-color: #333; overflow: hidden; margin-bottom: 20px; }
        .navbar a { float: left; color: white; padding: 14px 16px; text-decoration: none; }
        .navbar a:hover { background-color: #ddd; color: black; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">🏠 Dashboard</a>
        <a href="/books">📖 Livres</a>
        <a href="/bookcopies">📚 Exemplaires</a>
        <a href="/arrivals">📦 Arrivages</a>
        <a href="/authors">✍️ Auteurs</a>
        <a href="/categories">📂 Catégories</a>
        <a href="/customers">👥 Clients</a>
        <a href="/sales">💰 Ventes</a>
        <a href="/reservations">📅 Réservations</a>
        <a href="/genders">🏷️ Genres</a>
    </div>

    <h1>✍Nouvel auteur</h1>

    <a href="/authors">Retour à la liste</a>

    <br/><br/>

    <form th:action="@{/authors/save}" th:object="${author}" method="post">
        <label>Prénom :</label>
        <input type="text" th:field="*{firstName}" required/><br/>

        <label>Nom :</label>
        <input type="text" th:field="*{lastName}" required/><br/>

        <label>Biographie :</label>
        <textarea th:field="*{biography}" rows="4"></textarea><br/>

        <label>Nationalité :</label>
        <input type="text" th:field="*{nationality}"/><br/>

        <button type="submit">Enregistrer</button>
    </form>
</body>
</html>
