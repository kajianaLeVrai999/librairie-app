<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste des clients</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        .actions a { margin-right: 10px; }
        .navbar { background-color: #333; overflow: hidden; margin-bottom: 20px; }
        .navbar a { float: left; color: white; padding: 14px 16px; text-decoration: none; }
        .navbar a:hover { background-color: #ddd; color: black; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">Dashboard</a>
        <a href="/books">Livres</a>
        <a href="/customers">Clients</a>
        <a href="/sales">Ventes</a>
        <a href="/reservations">Réservations</a>
    </div>

    <h1>Liste des clients</h1>

    <a href="/customers/new">Ajouter un client</a>

    <br/><br/>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nom complet</th>
                <th>Email</th>
                <th>Téléphone</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="customer : ${customers}">
                <td th:text="${customer.id}">1</td>
                <td th:text="${customer.firstName} + ' ' + ${customer.lastName}">Nom</td>
                <td th:text="${customer.email}">email@example.com</td>
                <td th:text="${customer.phone}">0123456789</td>
                <td class="actions">
                    <a th:href="@{/customers/{id}(id=${customer.id})}">Voir</a>
                    <a th:href="@{/customers/delete/{id}(id=${customer.id})}"
                       onclick="return confirm('Supprimer ce client ?')">Supprimer</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
