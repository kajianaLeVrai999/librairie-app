<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste des réservations</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        .actions a { margin-right: 10px; }
        .status-pending { color: orange; }
        .status-confirmed { color: green; }
        .status-cancelled { color: red; }
        .navbar { background-color: #333; overflow: hidden; margin-bottom: 20px; }
        .navbar a { float: left; color: white; padding: 14px 16px; text-decoration: none; }
        .navbar a:hover { background-color: #ddd; color: black; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">Dashboard</a>
        <a href="/books">Livres</a>
        <a href="/customers">Clients</a>
        <a href="/sales">Ventes</a>
        <a href="/reservations">Réservations</a>
    </div>

    <h1>Liste des réservations</h1>

    <a href="/reservations/new">Nouvelle réservation</a>

    <br/><br/>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Date</th>
                <th>Expiration</th>
                <th>Client</th>
                <th>Livre</th>
                <th>Statut</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="reservation : ${reservations}">
                <td th:text="${reservation.id}">1</td>
                <td th:text="${reservation.reservationDate}">2024-01-01</td>
                <td th:text="${reservation.expirationDate}">2024-01-08</td>
                <td th:text="${reservation.customer != null ? reservation.customer.firstName + ' ' + reservation.customer.lastName : '—'}">Client</td>
                <td th:text="${reservation.bookCopy != null ? reservation.bookCopy.book.title : '—'}">Livre</td>
                <td>
                    <span th:class="${reservation.status == 'PENDING' ? 'status-pending' : (reservation.status == 'CONFIRMED' ? 'status-confirmed' : 'status-cancelled')}"
                          th:text="${reservation.status}">PENDING</span>
                </td>
                <td class="actions">
                    <a th:href="@{/reservations/confirm/{id}(id=${reservation.id})}"
                       th:if="${reservation.status == 'PENDING'}"
                       onclick="return confirm('Confirmer cette réservation ?')">Confirmer</a>
                    <a th:href="@{/reservations/cancel/{id}(id=${reservation.id})}"
                       th:if="${reservation.status == 'PENDING' or reservation.status == 'CONFIRMED'}"
                       onclick="return confirm('Annuler cette réservation ?')">Annuler</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
