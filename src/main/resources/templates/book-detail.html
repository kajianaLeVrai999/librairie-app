<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Détail du livre</title>
    <style>
        .info { margin: 10px 0; }
        .label { font-weight: bold; display: inline-block; width: 120px; }
        .navbar { background-color: #333; overflow: hidden; margin-bottom: 20px; }
        .navbar a { float: left; color: white; padding: 14px 16px; text-decoration: none; }
        .navbar a:hover { background-color: #ddd; color: black; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">🏠 Dashboard</a>
        <a href="/books">📖 Livres</a>
        <a href="/bookcopies">📚 Exemplaires</a>
        <a href="/arrivals">📦 Arrivages</a>
        <a href="/authors">✍️ Auteurs</a>
        <a href="/categories">📂 Catégories</a>
        <a href="/customers">👥 Clients</a>
        <a href="/sales">💰 Ventes</a>
        <a href="/reservations">📅 Réservations</a>
        <a href="/genders">🏷️ Genres</a>
    </div>


    <h1>Détail du livre</h1>

    <a href="/books">Retour à la liste</a>

    <br/><br/>

    <div th:if="${book == null}">
        <p style="color:red;">Livre non trouvé</p>
    </div>

    <div th:unless="${book == null}">
        <div class="info"><span class="label">ID :</span> <span th:text="${book.id}"></span></div>
        <div class="info"><span class="label">Titre :</span> <span th:text="${book.title}"></span></div>
        <div class="info"><span class="label">Description :</span> <span th:text="${book.description}"></span></div>
        <div class="info"><span class="label">Prix :</span> <span th:text="${book.price}"></span> Ar</div>
        <div class="info"><span class="label">ISBN :</span> <span th:text="${book.isbn}"></span></div>
        <div class="info"><span class="label">Date publication :</span> <span th:text="${book.publicationDate}"></span></div>
        <div class="info"><span class="label">Catégorie :</span> <span th:text="${book.category != null ? book.category.name : '—'}"></span></div>
    </div>
</body>
</html>
