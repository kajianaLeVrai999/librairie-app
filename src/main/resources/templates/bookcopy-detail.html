<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Détail de l'exemplaire</title>
    <style>
        .info { margin: 10px 0; }
        .label { font-weight: bold; display: inline-block; width: 120px; }
        .status-available { color: green; }
        .status-reserved { color: orange; }
        .status-sold { color: red; }
        .status-damaged { color: gray; }
        .navbar { background-color: #333; overflow: hidden; margin-bottom: 20px; }
        .navbar a { float: left; color: white; padding: 14px 16px; text-decoration: none; }
        .navbar a:hover { background-color: #ddd; color: black; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">🏠 Dashboard</a>
        <a href="/books">📖 Livres</a>
        <a href="/bookcopies">📚 Exemplaires</a>
        <a href="/arrivals">📦 Arrivages</a>
        <a href="/authors">✍️ Auteurs</a>
        <a href="/categories">📂 Catégories</a>
        <a href="/customers">👥 Clients</a>
        <a href="/sales">💰 Ventes</a>
        <a href="/reservations">📅 Réservations</a>
        <a href="/genders">🏷️ Genres</a>
    </div>

    <h1>Détail de l'exemplaire</h1>

    <a href="/bookcopies">Retour à la liste</a>

    <br/><br/>

    <div th:if="${bookCopy == null}">
        <p style="color:red;">Exemplaire non trouvé</p>
    </div>

    <div th:unless="${bookCopy == null}">
        <div class="info"><span class="label">ID :</span> <span th:text="${bookCopy.id}"></span></div>
        <div class="info"><span class="label">Livre :</span> <span th:text="${bookCopy.book != null ? bookCopy.book.title : '—'}"></span></div>
        <div class="info"><span class="label">Statut :</span>
            <span th:class="${bookCopy.status == 'AVAILABLE' ? 'status-available' : (bookCopy.status == 'RESERVED' ? 'status-reserved' : (bookCopy.status == 'SOLD' ? 'status-sold' : 'status-damaged'))}"
                  th:text="${bookCopy.status}">AVAILABLE</span>
        </div>
    </div>
</body>
</html>
