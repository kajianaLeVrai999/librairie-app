<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Library App - Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .navbar { background-color: #333; overflow: hidden; margin-bottom: 20px; }
        .navbar a { float: left; color: white; padding: 14px 16px; text-decoration: none; }
        .navbar a:hover { background-color: #ddd; color: black; }
        .card { border: 1px solid #ddd; border-radius: 5px; padding: 15px; margin: 10px; display: inline-block; width: 200px; vertical-align: top; }
        .card h3 { margin: 0; color: #4CAF50; }
        .card p { font-size: 24px; margin: 10px 0; }
        .stats-container { display: flex; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">Dashboard</a>
        <a href="/books">Livres</a>
        <a href="/customers">Clients</a>
        <a href="/sales">Ventes</a>
        <a href="/reservations">Réservations</a>
    </div>

    <h1>Library Management System</h1>

    <div class="stats-container">
        <div class="card">
            <h3>Livres</h3>
            <p th:text="${totalBooks}">0</p>
        </div>

        <div class="card">
            <h3>Exemplaires</h3>
            <p th:text="${totalBookCopies}">0</p>
        </div>

        <div class="card">
            <h3>Catégories</h3>
            <p th:text="${totalCategories}">0</p>
        </div>

        <div class="card">
            <h3>Auteurs</h3>
            <p th:text="${totalAuthors}">0</p>
        </div>

        <div class="card">
            <h3>Clients</h3>
            <p th:text="${totalCustomers}">0</p>
        </div>

        <div class="card">
            <h3>Réservations</h3>
            <p th:text="${totalReservations}">0</p>
        </div>

        <div class="card" style="background-color: #e8f5e9;">
            <h3>Ventes aujourd'hui</h3>
            <p th:text="${todaySalesCount}">0</p>
            <small>Revenus: <span th:text="${todayRevenue}">0</span> Ar</small>
        </div>
    </div>
</body>
</html>
