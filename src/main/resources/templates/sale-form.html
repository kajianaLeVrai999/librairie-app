<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Enregistrer une vente</title>
    <style>
        form { width: 500px; }
        label { display: inline-block; width: 150px; margin-top: 10px; }
        select, input { width: 300px; padding: 5px; }
        button { margin-top: 15px; padding: 8px 15px; }
        .navbar { background-color: #333; overflow: hidden; margin-bottom: 20px; }
        .navbar a { float: left; color: white; padding: 14px 16px; text-decoration: none; }
        .navbar a:hover { background-color: #ddd; color: black; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">🏠 Dashboard</a>
        <a href="/books">📖 Livres</a>
        <a href="/bookcopies">📚 Exemplaires</a>
        <a href="/arrivals">📦 Arrivages</a>
        <a href="/authors">✍️ Auteurs</a>
        <a href="/categories">📂 Catégories</a>
        <a href="/customers">👥 Clients</a>
        <a href="/sales">💰 Ventes</a>
        <a href="/reservations">📅 Réservations</a>
        <a href="/genders">🏷️ Genres</a>
    </div>


    <h1>Nouvelle vente</h1>

    <a href="/sales">Retour à la liste</a>

    <br/><br/>

    <form th:action="@{/sales/save}" th:object="${sale}" method="post">
        <label>Client :</label>
        <select th:field="*{customer.id}" required>
            <option value="">-- Sélectionner un client --</option>
            <option th:each="customer : ${customers}"
                    th:value="${customer.id}"
                    th:text="${customer.firstName} + ' ' + ${customer.lastName} + ' (' + ${customer.email} + ')'">
            </option>
        </select><br/>

        <label>Exemplaire :</label>
        <select th:field="*{bookCopy.id}" required>
            <option value="">-- Sélectionner un exemplaire --</option>
            <option th:each="bookCopy : ${bookCopies}"
                    th:value="${bookCopy.id}"
                    th:text="'Exemplaire #' + ${bookCopy.id} + ' - ' + ${bookCopy.book.title} + ' (' + ${bookCopy.status} + ')'">
            </option>
        </select><br/>

        <label>Quantité :</label>
        <input type="number" th:field="*{quantity}" min="1" required/><br/>

        <label>Montant total (Ar) :</label>
        <input type="number" step="0.01" th:field="*{totalAmount}" required/><br/>

        <button type="submit">Enregistrer la vente</button>
    </form>
</body>
</html>
