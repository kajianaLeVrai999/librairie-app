<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Détail de la réservation</title>
    <style>
        .info { margin: 10px 0; }
        .label { font-weight: bold; display: inline-block; width: 150px; }
        .status-pending { color: orange; }
        .status-confirmed { color: green; }
        .status-cancelled { color: red; }
        .navbar { background-color: #333; overflow: hidden; margin-bottom: 20px; }
        .navbar a { float: left; color: white; padding: 14px 16px; text-decoration: none; }
        .navbar a:hover { background-color: #ddd; color: black; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">🏠 Dashboard</a>
        <a href="/books">📖 Livres</a>
        <a href="/bookcopies">📚 Exemplaires</a>
        <a href="/arrivals">📦 Arrivages</a>
        <a href="/authors">✍️ Auteurs</a>
        <a href="/categories">📂 Catégories</a>
        <a href="/customers">👥 Clients</a>
        <a href="/sales">💰 Ventes</a>
        <a href="/reservations">📅 Réservations</a>
        <a href="/genders">🏷️ Genres</a>
    </div>


    <h1>Détail de la réservation</h1>

    <a href="/reservations">Retour à la liste</a>

    <br/><br/>

    <div th:if="${reservation == null}">
        <p style="color:red;">Réservation non trouvée</p>
    </div>

    <div th:unless="${reservation == null}">
        <div class="info"><span class="label">ID :</span> <span th:text="${reservation.id}"></span></div>
        <div class="info"><span class="label">Date de réservation :</span> <span th:text="${reservation.reservationDate}"></span></div>
        <div class="info"><span class="label">Date d'expiration :</span> <span th:text="${reservation.expirationDate}"></span></div>
        <div class="info"><span class="label">Client :</span> <span th:text="${reservation.customer != null ? reservation.customer.firstName + ' ' + reservation.customer.lastName : '—'}"></span></div>
        <div class="info"><span class="label">Exemplaire :</span> <span th:text="'#' + ${reservation.bookCopy.id}"></span></div>
        <div class="info"><span class="label">Livre :</span> <span th:text="${reservation.bookCopy.book.title}"></span></div>
        <div class="info"><span class="label">Statut :</span>
            <span th:class="${reservation.status == 'PENDING' ? 'status-pending' : (reservation.status == 'CONFIRMED' ? 'status-confirmed' : 'status-cancelled')}"
                  th:text="${reservation.status}">PENDING</span>
        </div>
    </div>
</body>
</html>
