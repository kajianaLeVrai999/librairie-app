<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ajouter un client</title>
    <style>
        form { width: 500px; }
        label { display: inline-block; width: 120px; margin-top: 10px; }
        input, textarea { width: 350px; padding: 5px; }
        button { margin-top: 15px; padding: 8px 15px; }
        .navbar { background-color: #333; overflow: hidden; margin-bottom: 20px; }
        .navbar a { float: left; color: white; padding: 14px 16px; text-decoration: none; }
        .navbar a:hover { background-color: #ddd; color: black; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">Dashboard</a>
        <a href="/books">Livres</a>
        <a href="/customers">Clients</a>
        <a href="/sales">Ventes</a>
        <a href="/reservations">Réservations</a>
    </div>

    <h1>Nouveau client</h1>

    <a href="/customers">Retour à la liste</a>

    <br/><br/>

    <form th:action="@{/customers/save}" th:object="${customer}" method="post">
        <label>Prénom :</label>
        <input type="text" th:field="*{firstName}" required/><br/>

        <label>Nom :</label>
        <input type="text" th:field="*{lastName}" required/><br/>

        <label>Email :</label>
        <input type="email" th:field="*{email}" required/><br/>

        <label>Téléphone :</label>
        <input type="tel" th:field="*{phone}"/><br/>

        <label>Adresse :</label>
        <textarea th:field="*{address}" rows="3"></textarea><br/>

        <button type="submit">Enregistrer</button>
    </form>
</body>
</html>
