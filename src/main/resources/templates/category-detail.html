<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Détail de la catégorie</title>
    <style>
        .info { margin: 10px 0; }
        .label { font-weight: bold; display: inline-block; width: 120px; }
        .navbar { background-color: #333; overflow: hidden; margin-bottom: 20px; }
        .navbar a { float: left; color: white; padding: 14px 16px; text-decoration: none; }
        .navbar a:hover { background-color: #ddd; color: black; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">🏠 Dashboard</a>
        <a href="/books">📖 Livres</a>
        <a href="/bookcopies">📚 Exemplaires</a>
        <a href="/arrivals">📦 Arrivages</a>
        <a href="/authors">✍️ Auteurs</a>
        <a href="/categories">📂 Catégories</a>
        <a href="/customers">👥 Clients</a>
        <a href="/sales">💰 Ventes</a>
        <a href="/reservations">📅 Réservations</a>
        <a href="/genders">🏷️ Genres</a>
    </div>

    <h1>Détail de la catégorie</h1>

    <a href="/categories">Retour à la liste</a>

    <br/><br/>

    <div th:if="${category == null}">
        <p style="color:red;">Catégorie non trouvée</p>
    </div>

    <div th:unless="${category == null}">
        <div class="info"><span class="label">ID :</span> <span th:text="${category.id}"></span></div>
        <div class="info"><span class="label">Nom :</span> <span th:text="${category.name}"></span></div>
        <div class="info"><span class="label">Description :</span> <span th:text="${category.description}"></span></div>
    </div>
</body>
</html>
