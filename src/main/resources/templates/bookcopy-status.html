<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Changer le statut</title>
    <style>
        form { width: 500px; }
        label { display: inline-block; width: 120px; margin-top: 10px; }
        select { width: 350px; padding: 5px; }
        button { margin-top: 15px; padding: 8px 15px; }
        .navbar { background-color: #333; overflow: hidden; margin-bottom: 20px; }
        .navbar a { float: left; color: white; padding: 14px 16px; text-decoration: none; }
        .navbar a:hover { background-color: #ddd; color: black; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">🏠 Dashboard</a>
        <a href="/books">📖 Livres</a>
        <a href="/bookcopies">📚 Exemplaires</a>
        <a href="/arrivals">📦 Arrivages</a>
        <a href="/authors">✍️ Auteurs</a>
        <a href="/categories">📂 Catégories</a>
        <a href="/customers">👥 Clients</a>
        <a href="/sales">💰 Ventes</a>
        <a href="/reservations">📅 Réservations</a>
        <a href="/genders">🏷️ Genres</a>
    </div>

    <h1>Changer le statut de l'exemplaire #<span th:text="${bookCopy.id}"></span></h1>

    <a th:href="@{/bookcopies/{id}(id=${bookCopy.id})}">Retour au détail</a>

    <br/><br/>

    <form th:action="@{/bookcopies/status/{id}(id=${bookCopy.id})}" method="post">
        <label>Nouveau statut :</label>
        <select name="status" required>
            <option th:each="status : ${copyStatuses}"
                    th:value="${status}"
                    th:text="${status}"
                    th:selected="${status == bookCopy.status}">
            </option>
        </select><br/>

        <button type="submit">Mettre à jour</button>
    </form>
</body>
</html>
