<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste des genres</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        .actions a { margin-right: 10px; text-decoration: none; padding: 5px 10px; border-radius: 4px; font-size: 12px; }
        .delete { background-color: #e74c3c; color: white; }
        .navbar { background-color: #333; overflow: hidden; margin-bottom: 20px; }
        .navbar a { float: left; color: white; padding: 14px 16px; text-decoration: none; }
        .navbar a:hover { background-color: #ddd; color: black; }
        .add-button { display: inline-block; background-color: #27ae60; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">🏠 Dashboard</a>
        <a href="/books">📖 Livres</a>
        <a href="/bookcopies">📚 Exemplaires</a>
        <a href="/arrivals">📦 Arrivages</a>
        <a href="/authors">✍️ Auteurs</a>
        <a href="/categories">📂 Catégories</a>
        <a href="/customers">👥 Clients</a>
        <a href="/sales">💰 Ventes</a>
        <a href="/reservations">📅 Réservations</a>
        <a href="/genders">🏷️ Genres</a>
    </div>

    <h1>Liste des genres littéraires</h1>

    <a href="/genders/new" class="add-button">Ajouter un genre</a>

    <br/><br/>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="gender : ${genders}">
                <td th:text="${gender.id}">1</td>
                <td th:text="${gender.name}">Nom</td>
                <td class="actions">
                    <a th:href="@{/genders/delete/{id}(id=${gender.id})}" class="delete"
                       onclick="return confirm('Supprimer ce genre ?')">Supprimer</a>
                </td>
            </tr>
            <tr th:if="${genders.empty}">
                <td colspan="3" style="text-align: center; padding: 40px; color: #7f8c8d;">
                    Aucun genre enregistré.
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
