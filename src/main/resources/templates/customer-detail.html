<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Détail du client</title>
    <style>
        .info { margin: 10px 0; }
        .label { font-weight: bold; display: inline-block; width: 120px; }
        .navbar { background-color: #333; overflow: hidden; margin-bottom: 20px; }
        .navbar a { float: left; color: white; padding: 14px 16px; text-decoration: none; }
        .navbar a:hover { background-color: #ddd; color: black; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">🏠 Dashboard</a>
        <a href="/books">📖 Livres</a>
        <a href="/bookcopies">📚 Exemplaires</a>
        <a href="/arrivals">📦 Arrivages</a>
        <a href="/authors">✍️ Auteurs</a>
        <a href="/categories">📂 Catégories</a>
        <a href="/customers">👥 Clients</a>
        <a href="/sales">💰 Ventes</a>
        <a href="/reservations">📅 Réservations</a>
        <a href="/genders">🏷️ Genres</a>
    </div>


    <h1>Détail du client</h1>

    <a href="/customers">Retour à la liste</a>

    <br/><br/>

    <div th:if="${customer == null}">
        <p style="color:red;">Client non trouvé</p>
    </div>

    <div th:unless="${customer == null}">
        <div class="info"><span class="label">ID :</span> <span th:text="${customer.id}"></span></div>
        <div class="info"><span class="label">Prénom :</span> <span th:text="${customer.firstName}"></span></div>
        <div class="info"><span class="label">Nom :</span> <span th:text="${customer.lastName}"></span></div>
        <div class="info"><span class="label">Email :</span> <span th:text="${customer.email}"></span></div>
        <div class="info"><span class="label">Téléphone :</span> <span th:text="${customer.phone}"></span></div>
        <div class="info"><span class="label">Adresse :</span> <span th:text="${customer.address}"></span></div>
    </div>
</body>
</html>
